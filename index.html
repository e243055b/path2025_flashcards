<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>病理フラッシュカード</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: sans-serif;
      background-color: #ffffff;
      color: #222222;
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    /*
      左側のカテゴリ欄と
      右側のカード欄を横に並べます。
    */
    .page-layout {
      display: flex;
      align-items: flex-start;
      gap: 24px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /*
      左側のカテゴリ欄
    */
    .sidebar {
      width: 180px;
      flex-shrink: 0;
    }

    .sidebar-title {
      margin: 0 0 10px;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
    }

    #categoryButtons {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .category-button {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #999999;
      border-radius: 6px;
      background-color: #ffffff;
      color: #222222;
      font-size: 16px;
      text-align: left;
      cursor: pointer;
    }

    .category-button:hover {
      background-color: #eeeeee;
    }

    /*
      選択中のカテゴリボタン
    */
    .category-button.active {
      border-color: #2667c9;
      background-color: #2667c9;
      color: #ffffff;
      font-weight: bold;
    }

    /*
      右側のカード欄
    */
    .main-area {
      flex: 1;
      min-width: 0;
      text-align: center;
    }

    #selectedCategory {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 18px;
      font-weight: bold;
    }

    /*
      番号入力欄
    */
    .number-jump-area {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .number-jump-area label {
      font-size: 16px;
    }

    #numberInput {
      width: 100px;
      padding: 8px;
      border: 1px solid #888888;
      border-radius: 6px;
      font-size: 17px;
      text-align: center;
    }

    #jumpButton {
      padding: 8px 14px;
      border: 1px solid #777777;
      border-radius: 6px;
      background-color: #ffffff;
      font-size: 16px;
      cursor: pointer;
    }

    #jumpButton:hover {
      background-color: #eeeeee;
    }

    #jumpMessage {
      min-height: 1.4em;
      margin: 4px 0 8px;
      color: #b00020;
      font-size: 15px;
    }

    #count {
      margin-top: 0;
      margin-bottom: 12px;
    }

    #error {
      color: #b00020;
      white-space: pre-wrap;
    }

    #photo {
      display: block;
      max-width: 100%;
      max-height: 60vh;
      margin: 0 auto;
      border: 1px solid #aaaaaa;
      object-fit: contain;
    }

    #imageError {
      display: none;
      margin: 16px auto;
      color: #b00020;
    }

    #hint {
      display: none;
      max-width: 750px;
      margin: 18px auto;
      padding: 14px;
      border-radius: 8px;
      background-color: #f1f1f1;
      font-size: 20px;
      text-align: left;
      white-space: pre-wrap;
    }

    #answer {
      display: none;
      margin: 20px;
      font-size: 28px;
      font-weight: bold;
      white-space: pre-wrap;
    }

    .buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    .control-button {
      padding: 10px 18px;
      border: 1px solid #777777;
      border-radius: 6px;
      background-color: #ffffff;
      color: #222222;
      font-size: 18px;
      cursor: pointer;
    }

    .control-button:hover {
      background-color: #eeeeee;
    }

    .control-button:disabled,
    #jumpButton:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    /*
      スマートフォンなどの狭い画面では、
      カテゴリボタンを上側へ移動します。
    */
    @media (max-width: 700px) {
      .page-layout {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
      }

      #categoryButtons {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
      }

      .category-button {
        width: auto;
        text-align: center;
      }

      #photo {
        max-height: 52vh;
      }
    }
  </style>
</head>

<body>

  <h1>病理フラッシュカード</h1>

  <div class="page-layout">

    <!-- 左側のカテゴリ欄 -->
    <aside class="sidebar">
      <p class="sidebar-title">
        カテゴリ
      </p>

      <div id="categoryButtons"></div>
    </aside>

    <!-- 右側のカード欄 -->
    <main class="main-area">

      <p id="selectedCategory">
        すべて
      </p>

      <!-- 通し番号による移動欄 -->
      <div class="number-jump-area">
        <label for="numberInput">
          通し番号：
        </label>

        <input
          id="numberInput"
          type="number"
          min="1"
          inputmode="numeric"
          placeholder="番号"
        >

        <button
          id="jumpButton"
          type="button"
        >
          移動
        </button>
      </div>

      <p id="jumpMessage"></p>

      <p id="count">
        読み込み中...
      </p>

      <p id="error"></p>

      <img
        id="photo"
        alt="病理画像"
      >

      <p id="imageError">
        画像を読み込めませんでした。
      </p>

      <div id="hint"></div>

      <div id="answer"></div>

      <div class="buttons">
        <button
          id="previousButton"
          class="control-button"
          type="button"
        >
          前へ
        </button>

        <button
          id="hintButton"
          class="control-button"
          type="button"
        >
          ヒントを見る
        </button>

        <button
          id="answerButton"
          class="control-button"
          type="button"
        >
          答えを見る
        </button>

        <button
          id="nextButton"
          class="control-button"
          type="button"
        >
          次へ
        </button>
      </div>

    </main>
  </div>

  <script>
    /*
      CSV内のすべてのカード
    */
    let allCards = [];

    /*
      現在選択中のカテゴリに属するカード
    */
    let filteredCards = [];

    /*
      現在表示しているカードの位置
    */
    let currentIndex = 0;

    /*
      現在選択中のカテゴリ
    */
    let selectedCategory = "すべて";


    /*
      CSVの1行を列ごとに分割します。

      カンマを含む文章が
      ダブルクォーテーションで囲まれている場合にも
      対応します。
    */
    function parseCSVLine(line) {
      const values = [];

      let currentValue = "";
      let insideQuotes = false;

      for (let i = 0; i < line.length; i++) {
        const character = line[i];

        if (character === '"') {
          if (
            insideQuotes &&
            line[i + 1] === '"'
          ) {
            currentValue += '"';
            i++;

          } else {
            insideQuotes = !insideQuotes;
          }

        } else if (
          character === "," &&
          !insideQuotes
        ) {
          values.push(currentValue);
          currentValue = "";

        } else {
          currentValue += character;
        }
      }

      values.push(currentValue);

      return values;
    }


    /*
      複数カテゴリを配列へ変換します。

      例：
      代謝障害|肝胆膵

      ↓

      ["代謝障害", "肝胆膵"]
    */
    function parseCategories(categoryText) {
      return categoryText
        .split("|")
        .map(category => category.trim())
        .filter(category => category !== "");
    }


    /*
      CSVの画像名から画像パスを作ります。

      amyloid01
      ↓
      images/amyloid01.jpg

      誤って.jpgを書いても動作します。
    */
    function createImagePath(fileName) {
      let cleanedName = fileName.trim();

      if (cleanedName.startsWith("images/")) {
        cleanedName = cleanedName.substring(
          "images/".length
        );
      }

      /*
        拡張子が書かれていない場合だけ
        .jpgを追加します。
      */
      if (!/\.[a-zA-Z0-9]+$/.test(cleanedName)) {
        cleanedName += ".jpg";
      }

      return "images/" + cleanedName;
    }


    /*
      cards.csvを読み込みます。
    */
    async function loadCards() {
      try {
        const response = await fetch(
          "cards.csv?v=" + Date.now()
        );

        if (!response.ok) {
          throw new Error(
            "cards.csvを取得できませんでした。"
          );
        }

        const csvText = await response.text();

        const lines = csvText
          .replace(/^\uFEFF/, "")
          .split(/\r?\n/)
          .filter(line => line.trim() !== "");

        if (lines.length < 2) {
          throw new Error(
            "cards.csvにカードが登録されていません。"
          );
        }

        /*
          CSVの1行目から各列の位置を取得します。
        */
        const headers = parseCSVLine(lines[0])
          .map(header => header.trim());

        const numberIndex =
          headers.indexOf("number");

        const imageIndex =
          headers.indexOf("image");

        const answerIndex =
          headers.indexOf("answer");

        const categoryIndex =
          headers.indexOf("category");

        const hintIndex =
          headers.indexOf("hint");

        if (
          numberIndex === -1 ||
          imageIndex === -1 ||
          answerIndex === -1 ||
          categoryIndex === -1 ||
          hintIndex === -1
        ) {
          throw new Error(
            "cards.csvの1行目には " +
            "number,image,answer,category,hint " +
            "が必要です。"
          );
        }

        /*
          CSVの2行目以降をカードへ変換します。
        */
        allCards = lines
          .slice(1)
          .map(line => {
            const columns = parseCSVLine(line);

            const numberText =
              (
                columns[numberIndex] || ""
              ).trim();

            const fileName =
              (
                columns[imageIndex] || ""
              ).trim();

            const answer =
              (
                columns[answerIndex] || ""
              ).trim();

            const categoryText =
              (
                columns[categoryIndex] || ""
              ).trim();

            const hint =
              (
                columns[hintIndex] || ""
              ).trim();

            return {
              number: Number(numberText),
              image: createImagePath(fileName),
              answer: answer,
              categories:
                parseCategories(categoryText),
              hint: hint
            };
          })
          .filter(card =>
            Number.isInteger(card.number) &&
            card.number > 0 &&
            card.image !== "images/.jpg" &&
            card.answer !== "" &&
            card.categories.length > 0
          );

        if (allCards.length === 0) {
          throw new Error(
            "有効なカードがありません。"
          );
        }

        /*
          通し番号の重複を確認します。
        */
        const numbers =
          allCards.map(card => card.number);

        const uniqueNumbers =
          new Set(numbers);

        if (
          uniqueNumbers.size !== numbers.length
        ) {
          throw new Error(
            "cards.csv内で通し番号が重複しています。"
          );
        }

        /*
          通し番号の小さい順に並べます。
        */
        allCards.sort(
          (a, b) => a.number - b.number
        );

        createCategoryButtons();

        filterByCategory("すべて");

      } catch (error) {
        showLoadError(error.message);
      }
    }


    /*
      全カードからカテゴリ一覧を取得します。
    */
    function getAllCategories() {
      const categorySet = new Set();

      allCards.forEach(card => {
        card.categories.forEach(category => {
          categorySet.add(category);
        });
      });

      return Array
        .from(categorySet)
        .sort(
          (a, b) =>
            a.localeCompare(b, "ja")
        );
    }


    /*
      左側にカテゴリボタンを作ります。
    */
    function createCategoryButtons() {
      const container =
        document.getElementById(
          "categoryButtons"
        );

      container.innerHTML = "";

      const categories = [
        "すべて",
        ...getAllCategories()
      ];

      categories.forEach(category => {
        const button =
          document.createElement("button");

        button.type = "button";
        button.textContent = category;
        button.className =
          "category-button";

        button.dataset.category = category;

        button.addEventListener(
          "click",
          () => {
            filterByCategory(category);
          }
        );

        container.appendChild(button);
      });
    }


    /*
      選択したカテゴリでカードを絞り込みます。
    */
    function filterByCategory(category) {
      selectedCategory = category;
      currentIndex = 0;

      if (category === "すべて") {
        filteredCards = [...allCards];

      } else {
        filteredCards = allCards.filter(
          card =>
            card.categories.includes(category)
        );
      }

      document.getElementById(
        "selectedCategory"
      ).textContent = category;

      document.getElementById(
        "jumpMessage"
      ).textContent = "";

      updateActiveCategoryButton();

      displayCard();
    }


    /*
      選択中のカテゴリボタンだけ色を変えます。
    */
    function updateActiveCategoryButton() {
      const buttons =
        document.querySelectorAll(
          ".category-button"
        );

      buttons.forEach(button => {
        const isSelected =
          button.dataset.category ===
          selectedCategory;

        button.classList.toggle(
          "active",
          isSelected
        );
      });
    }


    /*
      現在のカードを表示します。
    */
    function displayCard() {
      const photo =
        document.getElementById("photo");

      const imageError =
        document.getElementById(
          "imageError"
        );

      const hint =
        document.getElementById("hint");

      const answer =
        document.getElementById("answer");

      /*
        カードが変わるたびに
        ヒントと答えを隠します。
      */
      hint.style.display = "none";
      answer.style.display = "none";
      imageError.style.display = "none";

      if (filteredCards.length === 0) {
        document.getElementById(
          "count"
        ).textContent =
          "このカテゴリにはカードがありません。";

        photo.style.display = "none";
        photo.removeAttribute("src");

        updateControlButtons();

        return;
      }

      const card =
        filteredCards[currentIndex];

      photo.style.display = "block";
      photo.src = card.image;

      hint.textContent =
        card.hint !== ""
          ? card.hint
          : "ヒントは登録されていません。";

      answer.textContent = card.answer;

      /*
        現在の通し番号も表示します。
      */
      document.getElementById(
        "count"
      ).textContent =
        "No. " +
        card.number +
        "　　" +
        (currentIndex + 1) +
        " / " +
        filteredCards.length;

      /*
        入力欄にも現在の番号を反映します。
      */
      document.getElementById(
        "numberInput"
      ).value = card.number;

      updateControlButtons();
    }


    /*
      入力された通し番号のカードへ移動します。

      通し番号は全カード共通なので、
      カテゴリは「すべて」に切り替えます。
    */
    function jumpToNumber() {
      const input =
        document.getElementById(
          "numberInput"
        );

      const message =
        document.getElementById(
          "jumpMessage"
        );

      const requestedNumber =
        Number(input.value);

      message.textContent = "";

      if (
        !Number.isInteger(requestedNumber) ||
        requestedNumber <= 0
      ) {
        message.textContent =
          "正しい通し番号を入力してください。";

        return;
      }

      const targetIndex =
        allCards.findIndex(
          card =>
            card.number === requestedNumber
        );

      if (targetIndex === -1) {
        message.textContent =
          "No. " +
          requestedNumber +
          " のカードはありません。";

        return;
      }

      /*
        全カード表示へ切り替えます。
      */
      selectedCategory = "すべて";
      filteredCards = [...allCards];
      currentIndex = targetIndex;

      document.getElementById(
        "selectedCategory"
      ).textContent = "すべて";

      updateActiveCategoryButton();

      displayCard();
    }


    /*
      ヒントを表示します。
    */
    function showHint() {
      if (filteredCards.length === 0) {
        return;
      }

      document.getElementById(
        "hint"
      ).style.display = "block";
    }


    /*
      答えを表示します。
    */
    function showAnswer() {
      if (filteredCards.length === 0) {
        return;
      }

      document.getElementById(
        "answer"
      ).style.display = "block";
    }


    /*
      次のカードへ進みます。
    */
    function showNextCard() {
      if (filteredCards.length === 0) {
        return;
      }

      currentIndex =
        (currentIndex + 1) %
        filteredCards.length;

      document.getElementById(
        "jumpMessage"
      ).textContent = "";

      displayCard();
    }


    /*
      前のカードへ戻ります。
    */
    function showPreviousCard() {
      if (filteredCards.length === 0) {
        return;
      }

      currentIndex =
        (
          currentIndex -
          1 +
          filteredCards.length
        ) %
        filteredCards.length;

      document.getElementById(
        "jumpMessage"
      ).textContent = "";

      displayCard();
    }


    /*
      カードがない場合はボタンを無効にします。
    */
    function updateControlButtons() {
      const disabled =
        filteredCards.length === 0;

      document.getElementById(
        "previousButton"
      ).disabled = disabled;

      document.getElementById(
        "hintButton"
      ).disabled = disabled;

      document.getElementById(
        "answerButton"
      ).disabled = disabled;

      document.getElementById(
        "nextButton"
      ).disabled = disabled;

      document.getElementById(
        "jumpButton"
      ).disabled = allCards.length === 0;
    }


    /*
      CSVの読み込みエラーを表示します。
    */
    function showLoadError(message) {
      document.getElementById(
        "count"
      ).textContent = "";

      document.getElementById(
        "photo"
      ).style.display = "none";

      document.getElementById(
        "error"
      ).textContent =
        "読み込みエラー\n" +
        message +
        "\n\nGitHub PagesのURLから" +
        "開いているか確認してください。";

      allCards = [];
      filteredCards = [];

      updateControlButtons();
    }


    /*
      画像が見つからない場合の処理
    */
    document
      .getElementById("photo")
      .addEventListener(
        "error",
        () => {
          document.getElementById(
            "photo"
          ).style.display = "none";

          document.getElementById(
            "imageError"
          ).style.display = "block";
        }
      );


    /*
      画像が正常に読み込まれた場合の処理
    */
    document
      .getElementById("photo")
      .addEventListener(
        "load",
        () => {
          document.getElementById(
            "photo"
          ).style.display = "block";

          document.getElementById(
            "imageError"
          ).style.display = "none";
        }
      );


    /*
      各ボタンへ処理を割り当てます。
    */
    document
      .getElementById("previousButton")
      .addEventListener(
        "click",
        showPreviousCard
      );

    document
      .getElementById("hintButton")
      .addEventListener(
        "click",
        showHint
      );

    document
      .getElementById("answerButton")
      .addEventListener(
        "click",
        showAnswer
      );

    document
      .getElementById("nextButton")
      .addEventListener(
        "click",
        showNextCard
      );

    document
      .getElementById("jumpButton")
      .addEventListener(
        "click",
        jumpToNumber
      );


    /*
      番号入力欄でEnterを押した場合も移動します。
    */
    document
      .getElementById("numberInput")
      .addEventListener(
        "keydown",
        event => {
          if (event.key === "Enter") {
            jumpToNumber();
          }
        }
      );


    /*
      ページを開いたときにCSVを読み込みます。
    */
    loadCards();
  </script>

</body>
</html>
