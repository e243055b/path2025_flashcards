<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>病理フラッシュカード</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: sans-serif;
      background-color: #ffffff;
      color: #222222;
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    /*
      全体を左側のカテゴリ欄と
      右側のカード欄に分けます。
    */
    .page-layout {
      display: flex;
      align-items: flex-start;
      gap: 24px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /*
      左側のカテゴリ欄です。
    */
    .sidebar {
      width: 180px;
      flex-shrink: 0;
    }

    .sidebar-title {
      margin: 0 0 10px;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
    }

    #categoryButtons {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /*
      通常のカテゴリボタンです。
    */
    .category-button {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #999999;
      border-radius: 6px;
      background-color: #ffffff;
      color: #222222;
      font-size: 16px;
      text-align: left;
      cursor: pointer;
    }

    .category-button:hover {
      background-color: #eeeeee;
    }

    /*
      選択中のカテゴリボタンです。
    */
    .category-button.active {
      border-color: #2667c9;
      background-color: #2667c9;
      color: #ffffff;
      font-weight: bold;
    }

    /*
      右側のカード表示欄です。
    */
    .main-area {
      flex: 1;
      min-width: 0;
      text-align: center;
    }

    #selectedCategory {
      margin-top: 0;
      margin-bottom: 6px;
      font-size: 18px;
      font-weight: bold;
    }

    #count {
      margin-top: 0;
      margin-bottom: 12px;
    }

    #error {
      color: #b00020;
      white-space: pre-wrap;
    }

    #photo {
      display: block;
      max-width: 100%;
      max-height: 62vh;
      margin: 0 auto;
      border: 1px solid #aaaaaa;
      object-fit: contain;
    }

    /*
      画像が読み込めなかったときのメッセージです。
    */
    #imageError {
      display: none;
      margin: 16px auto;
      color: #b00020;
    }

    #hint {
      display: none;
      max-width: 750px;
      margin: 18px auto;
      padding: 14px;
      border-radius: 8px;
      background-color: #f1f1f1;
      font-size: 20px;
      text-align: left;
      white-space: pre-wrap;
    }

    #answer {
      display: none;
      margin: 20px;
      font-size: 28px;
      font-weight: bold;
      white-space: pre-wrap;
    }

    .buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    .control-button {
      padding: 10px 18px;
      border: 1px solid #777777;
      border-radius: 6px;
      background-color: #ffffff;
      color: #222222;
      font-size: 18px;
      cursor: pointer;
    }

    .control-button:hover {
      background-color: #eeeeee;
    }

    .control-button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    /*
      画面が狭い場合は、
      カテゴリ欄をカード欄の上へ移動します。
    */
    @media (max-width: 700px) {
      .page-layout {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
      }

      #categoryButtons {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
      }

      .category-button {
        width: auto;
        text-align: center;
      }

      #photo {
        max-height: 55vh;
      }
    }
  </style>
</head>

<body>

  <h1>病理フラッシュカード</h1>

  <div class="page-layout">

    <!-- 左側のカテゴリ欄 -->
    <aside class="sidebar">
      <p class="sidebar-title">
        カテゴリ
      </p>

      <div id="categoryButtons"></div>
    </aside>

    <!-- 右側のカード欄 -->
    <main class="main-area">

      <p id="selectedCategory">
        すべて
      </p>

      <p id="count">
        読み込み中...
      </p>

      <p id="error"></p>

      <img
        id="photo"
        alt="病理画像"
      >

      <p id="imageError">
        画像を読み込めませんでした。
      </p>

      <div id="hint"></div>

      <div id="answer"></div>

      <div class="buttons">
        <button
          id="previousButton"
          class="control-button"
          type="button"
        >
          前へ
        </button>

        <button
          id="hintButton"
          class="control-button"
          type="button"
        >
          ヒントを見る
        </button>

        <button
          id="answerButton"
          class="control-button"
          type="button"
        >
          答えを見る
        </button>

        <button
          id="nextButton"
          class="control-button"
          type="button"
        >
          次へ
        </button>
      </div>

    </main>
  </div>

  <script>
    /*
      すべてのカードを保存します。
    */
    let allCards = [];

    /*
      現在選択されているカテゴリに属するカードです。
    */
    let filteredCards = [];

    /*
      現在表示しているカード番号です。
    */
    let currentIndex = 0;

    /*
      現在選択されているカテゴリです。
    */
    let selectedCategory = "すべて";


    /*
      CSVの1行を列に分割します。

      カンマを含む文章が
      ダブルクォーテーションで囲まれている場合にも
      対応します。
    */
    function parseCSVLine(line) {
      const values = [];

      let currentValue = "";
      let insideQuotes = false;

      for (let i = 0; i < line.length; i++) {
        const character = line[i];

        if (character === '"') {
          /*
            CSV内の "" は、
            1個の " として扱います。
          */
          if (
            insideQuotes &&
            line[i + 1] === '"'
          ) {
            currentValue += '"';
            i++;

          } else {
            insideQuotes = !insideQuotes;
          }

        } else if (
          character === "," &&
          !insideQuotes
        ) {
          values.push(currentValue);
          currentValue = "";

        } else {
          currentValue += character;
        }
      }

      values.push(currentValue);

      return values;
    }


    /*
      複数カテゴリを配列に変換します。

      例：
      代謝障害|肝胆膵

      ↓

      ["代謝障害", "肝胆膵"]
    */
    function parseCategories(categoryText) {
      return categoryText
        .split("|")
        .map(category => category.trim())
        .filter(category => category !== "");
    }


    /*
      CSVに書かれた画像名へ
      images/を自動で付けます。
    */
    function createImagePath(fileName) {
      if (fileName.startsWith("images/")) {
        return fileName;
      }

      return "images/" + fileName;
    }


    /*
      cards.csvを読み込みます。
    */
    async function loadCards() {
      try {
        /*
          URLに現在時刻を付けて、
          古いCSVのキャッシュを避けます。
        */
        const response = await fetch(
          "cards.csv?v=" + Date.now()
        );

        if (!response.ok) {
          throw new Error(
            "cards.csvを取得できませんでした。"
          );
        }

        const csvText = await response.text();

        /*
          UTF-8 BOMと空行を除去します。
        */
        const lines = csvText
          .replace(/^\uFEFF/, "")
          .split(/\r?\n/)
          .filter(line => line.trim() !== "");

        if (lines.length < 2) {
          throw new Error(
            "cards.csvにカードが登録されていません。"
          );
        }

        /*
          CSVの1行目から列番号を取得します。
        */
        const headers = parseCSVLine(lines[0])
          .map(header => header.trim());

        const imageIndex =
          headers.indexOf("image");

        const answerIndex =
          headers.indexOf("answer");

        const categoryIndex =
          headers.indexOf("category");

        const hintIndex =
          headers.indexOf("hint");

        if (
          imageIndex === -1 ||
          answerIndex === -1 ||
          categoryIndex === -1 ||
          hintIndex === -1
        ) {
          throw new Error(
            "cards.csvの1行目には " +
            "image,answer,category,hint " +
            "が必要です。"
          );
        }

        /*
          CSVの2行目以降をカードに変換します。
        */
        allCards = lines
          .slice(1)
          .map(line => {
            const columns = parseCSVLine(line);

            const fileName =
              (
                columns[imageIndex] || ""
              ).trim();

            const answer =
              (
                columns[answerIndex] || ""
              ).trim();

            const categoryText =
              (
                columns[categoryIndex] || ""
              ).trim();

            const hint =
              (
                columns[hintIndex] || ""
              ).trim();

            return {
              image: createImagePath(fileName),
              answer: answer,
              categories:
                parseCategories(categoryText),
              hint: hint
            };
          })
          .filter(card =>
            card.image !== "images/" &&
            card.answer !== "" &&
            card.categories.length > 0
          );

        if (allCards.length === 0) {
          throw new Error(
            "有効なカードがありません。"
          );
        }

        /*
          カテゴリボタンを作成します。
        */
        createCategoryButtons();

        /*
          最初はすべてのカードを表示対象にします。
        */
        filterByCategory("すべて");

      } catch (error) {
        showLoadError(error.message);
      }
    }


    /*
      全カードからカテゴリ一覧を作ります。
    */
    function getAllCategories() {
      const categorySet = new Set();

      allCards.forEach(card => {
        card.categories.forEach(category => {
          categorySet.add(category);
        });
      });

      return Array
        .from(categorySet)
        .sort(
          (a, b) =>
            a.localeCompare(b, "ja")
        );
    }


    /*
      左側にカテゴリボタンを作ります。
    */
    function createCategoryButtons() {
      const container =
        document.getElementById(
          "categoryButtons"
        );

      container.innerHTML = "";

      const categories = [
        "すべて",
        ...getAllCategories()
      ];

      categories.forEach(category => {
        const button =
          document.createElement("button");

        button.type = "button";
        button.textContent = category;
        button.className =
          "category-button";

        /*
          CSSやJavaScriptからカテゴリを
          判別できるように保存します。
        */
        button.dataset.category = category;

        button.addEventListener(
          "click",
          () => {
            filterByCategory(category);
          }
        );

        container.appendChild(button);
      });
    }


    /*
      選択されたカテゴリで
      カードを絞り込みます。
    */
    function filterByCategory(category) {
      selectedCategory = category;
      currentIndex = 0;

      if (category === "すべて") {
        filteredCards = [...allCards];

      } else {
        filteredCards = allCards.filter(
          card =>
            card.categories.includes(category)
        );
      }

      document.getElementById(
        "selectedCategory"
      ).textContent = category;

      updateActiveCategoryButton();

      displayCard();
    }


    /*
      選択中のカテゴリボタンだけ
      activeクラスを付けます。
    */
    function updateActiveCategoryButton() {
      const buttons =
        document.querySelectorAll(
          ".category-button"
        );

      buttons.forEach(button => {
        const isSelected =
          button.dataset.category ===
          selectedCategory;

        button.classList.toggle(
          "active",
          isSelected
        );
      });
    }


    /*
      現在のカードを表示します。
    */
    function displayCard() {
      const photo =
        document.getElementById("photo");

      const imageError =
        document.getElementById(
          "imageError"
        );

      const hint =
        document.getElementById("hint");

      const answer =
        document.getElementById("answer");

      /*
        ヒントと答えを隠します。
      */
      hint.style.display = "none";
      answer.style.display = "none";
      imageError.style.display = "none";

      if (filteredCards.length === 0) {
        document.getElementById(
          "count"
        ).textContent =
          "このカテゴリにはカードがありません。";

        photo.style.display = "none";
        photo.removeAttribute("src");

        updateControlButtons();

        return;
      }

      const card =
        filteredCards[currentIndex];

      photo.style.display = "block";
      photo.src = card.image;

      /*
        ヒントが空欄の場合の表示です。
      */
      hint.textContent =
        card.hint !== ""
          ? card.hint
          : "ヒントは登録されていません。";

      answer.textContent = card.answer;

      document.getElementById(
        "count"
      ).textContent =
        (currentIndex + 1) +
        " / " +
        filteredCards.length;

      updateControlButtons();
    }


    /*
      ヒントを表示します。
      一度表示した後も、ボタン名は変えません。
    */
    function showHint() {
      if (filteredCards.length === 0) {
        return;
      }

      document.getElementById(
        "hint"
      ).style.display = "block";
    }


    /*
      答えを表示します。
      一度表示した後も、ボタン名は変えません。
    */
    function showAnswer() {
      if (filteredCards.length === 0) {
        return;
      }

      document.getElementById(
        "answer"
      ).style.display = "block";
    }


    /*
      次のカードへ進みます。
      最後のカードの次は最初へ戻ります。
    */
    function showNextCard() {
      if (filteredCards.length === 0) {
        return;
      }

      currentIndex =
        (currentIndex + 1) %
        filteredCards.length;

      displayCard();
    }


    /*
      前のカードへ戻ります。
      最初のカードの前は最後へ移動します。
    */
    function showPreviousCard() {
      if (filteredCards.length === 0) {
        return;
      }

      currentIndex =
        (
          currentIndex -
          1 +
          filteredCards.length
        ) %
        filteredCards.length;

      displayCard();
    }


    /*
      カードがない場合は
      操作ボタンを無効にします。
    */
    function updateControlButtons() {
      const disabled =
        filteredCards.length === 0;

      document.getElementById(
        "previousButton"
      ).disabled = disabled;

      document.getElementById(
        "hintButton"
      ).disabled = disabled;

      document.getElementById(
        "answerButton"
      ).disabled = disabled;

      document.getElementById(
        "nextButton"
      ).disabled = disabled;
    }


    /*
      CSVの読み込みエラーを表示します。
    */
    function showLoadError(message) {
      document.getElementById(
        "count"
      ).textContent = "";

      document.getElementById(
        "photo"
      ).style.display = "none";

      document.getElementById(
        "error"
      ).textContent =
        "読み込みエラー\n" +
        message +
        "\n\nGitHub PagesのURLから" +
        "開いているか確認してください。";

      filteredCards = [];

      updateControlButtons();
    }


    /*
      画像ファイルが存在しない場合の処理です。
    */
    document
      .getElementById("photo")
      .addEventListener(
        "error",
        () => {
          document.getElementById(
            "photo"
          ).style.display = "none";

          document.getElementById(
            "imageError"
          ).style.display = "block";
        }
      );


    /*
      画像が正常に読み込まれた場合の処理です。
    */
    document
      .getElementById("photo")
      .addEventListener(
        "load",
        () => {
          document.getElementById(
            "photo"
          ).style.display = "block";

          document.getElementById(
            "imageError"
          ).style.display = "none";
        }
      );


    /*
      各操作ボタンに処理を割り当てます。
    */
    document
      .getElementById("previousButton")
      .addEventListener(
        "click",
        showPreviousCard
      );

    document
      .getElementById("hintButton")
      .addEventListener(
        "click",
        showHint
      );

    document
      .getElementById("answerButton")
      .addEventListener(
        "click",
        showAnswer
      );

    document
      .getElementById("nextButton")
      .addEventListener(
        "click",
        showNextCard
      );


    /*
      ページを開いたときに
      CSVを読み込みます。
    */
    loadCards();
  </script>

</body>
</html>
